[package]
name = "raft"
version = "0.1.0"
edition = "2021"

[lib]
name = "raft"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4", features = ["derive"] }  # command-line parsing

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "heap"
harness = false

[[bench]]
name = "compiler"
harness = false

[profile.dev]
debug = true

[profile.release]
debug = false
