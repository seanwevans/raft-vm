name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  benchmarks:
    name: Benchmarks build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build but do not run: benchmark timings from a shared CI runner are too
      # noisy to gate on. This only keeps the benchmarks from rotting.
      - run: cargo bench --no-run

  playground:
    name: Playground build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/wasm
      # The playground crate is its own workspace, so `cargo test --all` never
      # compiles it. Building it here is what catches a change to the VM that
      # breaks the browser build -- a dependency that will not cross-compile,
      # or an API the wasm shim calls.
      # rustfmt is pointed at the playground's own source rather than run
      # through cargo, which follows the path dependency back into the VM and
      # reports it here as well as in the job that owns it.
      - name: Check formatting
        run: rustfmt --edition 2021 --check web/wasm/src/lib.rs
      - name: Lint
        run: |
          cargo clippy --manifest-path web/wasm/Cargo.toml \
            --release --target wasm32-unknown-unknown -- -D warnings
      - name: Build the playground
        run: ./web/build.sh
      - name: Check the built site
        run: |
          test -s web/dist/raft.wasm
          test -s web/dist/index.html
          test -s web/dist/examples/index.json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Report coverage
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"

      # Floor, not a target. Set just under the current figure so the build
      # catches a change that guts the tests without tripping on ordinary
      # refactors. Raise it as coverage climbs.
      - name: Enforce minimum coverage
        run: cargo llvm-cov report --fail-under-lines 75

      - name: Upload lcov report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info
